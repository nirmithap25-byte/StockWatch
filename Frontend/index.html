<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockWatch - Login</title>

    <link rel="stylesheet" href="css/login.css">

    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">

    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>

    <div class="login-container">

        <div class="logo-section">

            <div class="logo-circle">
                <span class="material-symbols-outlined">
                    inventory_2
                </span>
            </div>

            <h1>StockWatch</h1>

            <p>Smarter Inventory and Safer Audits</p>

        </div>

        <div class="login-card">

            <h2>Login</h2>

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email">

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password">

            </div>

            <button id="loginBtn">
                Login
            </button>

            <p id="message"></p>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
